name: screenshots

# Renders the README images from the real app (sample data, dark mode) and commits them.
# Run it by hand from the Actions tab whenever the UI changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release --product MacropadMenuBar

      - name: Render
        run: |
          BIN="$(swift build -c release --show-bin-path)/MacropadMenuBar"
          "$BIN" --screenshots "$PWD/docs/images" &
          PID=$!
          for i in $(seq 1 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill -0 $PID 2>/dev/null && { echo "timed out"; kill $PID; exit 1; }
          wait $PID
          ls -la docs/images

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images/*.png

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "Atualiza capturas do README [skip ci]"
          git push
