name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      VERSION: 0.2.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Translations complete (pt/en/es)
        run: python3 scripts/check-l10n.py

      - name: Test (protocol checked against the Python CLI's packets)
        run: swift test

      - name: Build Macropad.app (universal)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Zip
        run: |
          cd build
          ditto -c -k --keepParent Macropad.app Macropad.zip
          echo "$GITHUB_SHA" > commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Macropad
          path: build/Macropad.zip

      # Every push to main becomes a release, so the app's "Atualizar" button can fetch
      # releases/latest/download/Macropad.zip without logging in.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" build/Macropad.zip build/commit.txt \
            --target "$GITHUB_SHA" --title "Macropad $VERSION" --generate-notes --latest
